<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모의고사 결과표 로딩중...</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imgUrl = urlParams.get('url');
        if (imgUrl) {
            // Fix mixed content and instantly redirect to the raw image URL
            // Kakao Webview will render raw images with native zoom & save support
            const secureUrl = imgUrl.replace('http://', 'https://');
            window.location.replace(secureUrl);
        } else {
            alert('이미지를 불러올 수 없습니다.');
        }
    </script>
</body>
</html>
