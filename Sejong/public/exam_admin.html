<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모의고사 결과 관리</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="exam_admin.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="admin-header">
        <a href="app.html" class="back-btn"><span class="material-icons">arrow_back</span></a>
        <h1>모의고사 결과 관리</h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="table-wrapper">
                <table class="admin-table" id="examTable">
                    <thead>
                        <tr>
                            <th>학생번호/이름</th>
                            <th>응시 과목</th>
                            <th>접수 일시(시작)</th>
                            <th>소요 시간</th>
                            <th>점수</th>
                            <th>합격여부</th>
                        </tr>
                    </thead>
                    <tbody id="examTableBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Analysis Modal (A4 Printable Report) -->
    <div id="analysisModal" class="modal-overlay">
        <div class="modal-actions">
            <button class="action-btn" onclick="closeModal()"><span class="material-icons">close</span></button>
            <button class="action-btn primary" onclick="window.print()"><span class="material-icons">print</span></button>
        </div>

        <div class="report-a4">
            
            <div class="report-columns">
                <!-- Left Column -->
                <div class="report-left">
                    <div class="report-header">
                        <div class="report-title-box">
                            <h2 id="reportExamName">조리기능사</h2>
                            <h1>모의고사 결과분석</h1>
                        </div>
                        <div class="report-info-box">
                            <div class="info-row"><span class="info-label">Date :</span> <span class="info-val" id="reportDate">-</span></div>
                            <div class="info-row"><span class="info-label">Time :</span> <span class="info-val" id="reportTime">-</span></div>
                            <div class="info-row"><span class="info-label">Name :</span> <span class="info-val" id="reportStudent">-</span></div>
                            <div class="info-row"><span class="info-label">Score :</span> <span class="info-val" id="reportScore">-</span></div>
                        </div>
                    </div>

                    <div class="section-title">&lt; 평가 내용 및 문항 결과 &gt;</div>
                    
                    <div class="q-table-wrapper">
                        <!-- Left half (1~30) -->
                        <table class="q-table" id="qTable1">
                            <thead>
                                <tr>
                                    <th>문항</th>
                                    <th>학생답</th>
                                    <th>정답</th>
                                    <th>여부</th>
                                    <th>내용영역</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        
                        <!-- Right half (31~60) -->
                        <table class="q-table" id="qTable2">
                            <thead>
                                <tr>
                                    <th>문항</th>
                                    <th>학생답</th>
                                    <th>정답</th>
                                    <th>여부</th>
                                    <th>내용영역</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="report-right">
                    
                    <div class="section-title">&lt; 영역별 정답률 &gt;</div>
                    <div class="chart-box">
                        <div class="canvas-wrapper">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>

                    <div class="section-title">&lt; 학생 학습 밸런스 &gt;</div>
                    <div class="chart-box">
                        <div class="canvas-wrapper large">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <div class="section-title">&lt; 내용영역별 상세 분석 &gt;</div>
                    <table class="analysis-table" id="analysisTable">
                        <thead>
                            <tr>
                                <th>영역</th>
                                <th>문항수</th>
                                <th>정답수</th>
                                <th>정답률</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>

                </div>
            </div>

            <!-- Footer -->
            <div class="report-footer">
                <div>
                    <div class="academy-name">세종요리제과기술학원</div>
                    <div class="academy-info">
                        02-000-0000 / 010-0000-0000<br>
                        https://sejongcook.co.kr
                    </div>
                </div>
                <div class="stamp">
                    <div>
                        <div class="stamp-title">담당자</div>
                        <div></div>
                    </div>
                    <div>
                        <div class="stamp-title">원장</div>
                        <div></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="exam_admin.js"></script>
</body>
</html>
