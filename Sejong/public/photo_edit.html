<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>개인 사진 수정 - 세종요리제과학원</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; color: #334155; }
        .header { background: #0f172a; color: white; padding: 15px 20px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        .current-photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #e2e8f0; margin: 0 auto 15px; display: block; background: #f1f5f9; }
        
        .btn { display: inline-block; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; border: none; cursor: pointer; margin-bottom: 10px; box-sizing: border-box; text-align: center; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-secondary { background: #e2e8f0; color: #475569; }
        .btn-success { background: #10b981; color: white; }

        /* Cropper Modal */
        #cropperModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .cropper-container-wrapper { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        .cropper-container-wrapper img { max-width: 100%; max-height: 100%; }
        .cropper-controls { padding: 20px; background: #1e293b; display: flex; gap: 10px; justify-content: space-between; }
        
        /* Loading Overlay */
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index: 2000; display:flex; justify-content:center; align-items:center; flex-direction:column; display:none; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Make cropper look circular */
        .cropper-view-box,
        .cropper-face {
          border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="header">
        수강생 사진 등록
    </div>

    <div class="container">
        <div class="card" id="userInfoCard" style="display:none;">
            <img id="currentPhoto" class="current-photo" src="" alt="현재 사진">
            <div id="noPhotoIcon" style="width: 120px; height: 120px; border-radius: 50%; background: #e2e8f0; display: none; align-items: center; justify-content: center; margin: 0 auto 15px auto; border: 4px solid #cbd5e1;">
                <span class="material-icons" style="color:#94a3b8; font-size: 48px;">person</span>
            </div>
            <h2 style="margin: 0 0 5px; color: #0f172a;" id="memberName">홍길동</h2>
            <p style="margin: 0 0 20px; color: #64748b; font-size: 0.95rem;" id="memberCourse">제과제빵 기능사</p>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <label for="fileInput" class="btn btn-primary" style="flex:1; display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:0; font-size: 0.95rem; padding: 12px;">
                    <span class="material-icons" style="font-size:18px;">photo_camera</span> 새 사진 선택
                </label>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                
                <button id="editCurrentBtn" class="btn btn-success" style="flex:1; display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:0; font-size: 0.95rem; padding: 12px;" onclick="editCurrentPhoto()">
                    <span class="material-icons" style="font-size:18px;">edit</span> 현재 사진 수정
                </button>
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn" style="flex:1; background:#8b5cf6; color:white; display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:0; font-size: 0.95rem; padding: 12px;" onclick="showFortune()">
                    <span class="material-icons" style="font-size:18px;">psychology</span> AI 관상보기
                </button>
            </div>
            
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 15px; text-align: left; background: #f8fafc; padding: 10px; border-radius: 8px;">
                * 사진은 출석 확인용으로만 사용되며, 정면 얼굴이 잘 보이는 밝은 사진을 권장합니다.<br>
                * 밝기/대비 외에 과도한 보정은 키오스크 얼굴 인식 실패의 원인이 됩니다.
            </p>
        </div>

        <div id="errorCard" class="card" style="display:none; color:#ef4444;">
            <span class="material-icons" style="font-size:48px; margin-bottom:10px;">error_outline</span>
            <h3>잘못된 접근입니다.</h3>
            <p>전달받으신 전용 링크로 다시 접속해 주세요.</p>
        </div>
    </div>

    <!-- Cropper Modal -->
    <div id="cropperModal">
        <div class="cropper-container-wrapper">
            <img id="imageToCrop" src="">
        </div>
        <div style="background: #1e293b; color: white; text-align: center; padding: 10px; font-size: 0.9rem;">
            손가락으로 확대/축소하고, 원 안에 얼굴을 맞춰주세요.
        </div>
        <div class="cropper-controls">
            <button class="btn btn-secondary" onclick="closeCropper()" style="margin-bottom:0; width: 48%;">취소</button>
            <button class="btn btn-success" onclick="confirmCrop()" style="margin-bottom:0; width: 48%;">자르기 완료</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column;">
        <div style="flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; position: relative;">
            <canvas id="editCanvas" style="max-width: 100%; max-height: 100%; border-radius: 50%; box-shadow: 0 0 20px rgba(255,255,255,0.1);"></canvas>
            <div id="faceLoadingIndicator" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; background:rgba(0,0,0,0.7); padding:10px 20px; border-radius:20px; display:none; font-size:0.9rem;">
                얼굴 분석 중... <span class="spinner" style="width:15px; height:15px; border-width:2px; display:inline-block; vertical-align:middle; margin-left:5px; margin-bottom:0;"></span>
            </div>
        </div>
        
        <!-- Filter Controls -->
        <div style="background: #0f172a; color: white; padding: 10px 15px; border-bottom: 1px solid #334155; font-size: 0.9rem; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; max-height: 40vh;">
            
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p style="margin: 0; font-weight:bold; font-size: 1rem; color: #fff;">📸 고급 사진 보정</p>
                <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem; width: auto; margin:0; background:#334155; border:none; color:#f8fafc;" onclick="applyAdvancedFilter('none')">원본 복구</button>
            </div>

            <!-- Categories Tabs -->
            <div style="display: flex; gap: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; overflow-x: auto; white-space: nowrap;">
                <button class="filter-tab active" data-tab="basic" onclick="switchTab('basic')" style="background:#3b82f6; color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">기본/흑백</button>
                <button class="filter-tab" data-tab="beauty" onclick="switchTab('beauty')" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:8px 12px; border-radius:8px; cursor:pointer;">뽀샵(피부)</button>
                <button class="filter-tab" data-tab="art" onclick="switchTab('art')" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:8px 12px; border-radius:8px; cursor:pointer;">아트(애니)</button>
            </div>

            <!-- Thumbnail Container -->
            <div id="filterThumbnails" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; min-height: 120px; align-items:flex-start;">
                <!-- JS will populate thumbnails -->
            </div>
        </div>

        <div class="cropper-controls" style="background:#0f172a; padding:15px; border-top:1px solid #1e293b;">
            <button class="btn btn-secondary" onclick="backToCrop()" style="margin-bottom:0; width: 48%; background:#334155; border:none; color:white;">다시 자르기</button>
            <button class="btn btn-success" onclick="saveFinal()" style="margin-bottom:0; width: 48%;">최종 저장</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <h3 style="color:#0f172a; margin:0;" id="loadingText">처리 중...</h3>
        <p style="color:#64748b; font-size:0.9rem; margin-top:5px;">잠시만 기다려주세요</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="/sejong/photo_edit.js?v=20260624-14"></script>
    <script src="sidebar_sync.js?v=20260624-14"></script>
</body>
</html>
