<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>관리자 계정 설정 - 세종요리제과학원</title>
    <link rel="stylesheet" href="style.css?v=20260725-2">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc; 
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .settings-container { 
            width: 100%;
            max-width: 500px; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            padding: 40px 30px; 
            margin: 20px;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #334155; }
        .form-group input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #3b82f6; }
        .btn-save { width: 100%; padding: 16px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); margin-top: 10px; }
        .btn-save:hover { background: #2563eb; }
        .back-link { display: inline-flex; align-items: center; gap: 5px; color: #64748b; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        .back-link:hover { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="settings-container">
        <h2 style="margin-top: 0; margin-bottom: 30px; color: #0f172a; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <span class="material-icons" style="font-size: 32px; color: #3b82f6;">manage_accounts</span>
            관리자 아이디/비밀번호
        </h2>
        
        <div class="current-account-box" style="margin-bottom: 25px; padding: 16px; background-color: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 8px;">
                <span style="font-size: 0.9rem; font-weight: 600; color: #64748b;">현재 계정 정보</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.9rem; color: #64748b;">아이디</span>
                    <span id="currentIdDisplay" style="font-size: 1.1rem; font-weight: 700; color: #0f172a;">로딩중...</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.9rem; color: #64748b;">비밀번호</span>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span id="currentPwDisplay" style="font-size: 1.1rem; font-weight: 700; color: #0f172a; letter-spacing: 2px;">로딩중...</span>
                        <label style="display: flex; align-items: center; gap: 4px; font-weight: 400; color: #64748b; font-size: 0.8rem; cursor: pointer; margin: 0;">
                            <input type="checkbox" id="showCurrentPwCheckbox" onchange="toggleCurrentPasswordVisibility()" style="width: 14px; height: 14px; margin: 0; padding: 0; cursor: pointer; accent-color: #3b82f6;">
                            보기
                        </label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="adminId">변경할 아이디 <span style="font-size:0.85rem; color:#64748b; font-weight:normal; margin-left: 5px;">(변경하지 않으려면 비워두세요)</span></label>
            <input type="text" id="adminId" autocomplete="off" placeholder="새로운 아이디">
        </div>
        
        <div class="form-group">
            <label for="adminPw">변경할 비밀번호 <span style="font-size:0.85rem; color:#64748b; font-weight:normal; margin-left: 5px;">(변경하지 않으려면 비워두세요)</span></label>
            <input type="password" id="adminPw" autocomplete="new-password" placeholder="새로운 비밀번호">
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 400; color: #475569; font-size: 0.95rem; cursor: pointer;">
                <input type="checkbox" id="showPwCheckbox" onchange="togglePasswordVisibility()" style="width: 18px; height: 18px; margin: 0; padding: 0; cursor: pointer; accent-color: #3b82f6;">
                비밀번호 표시
            </label>
        </div>
        
        <button class="btn-save" onclick="saveAdminAccount()">변경사항 저장</button>
        
        <div style="margin-top: 25px; text-align: center;">
            <a href="index.html" class="back-link">
                <span class="material-icons" style="font-size: 18px;">arrow_back</span>
                메인으로 돌아가기
            </a>
        </div>
    </div>

    <script src="admin_account.js?v=20260725-2"></script>
</body>
</html>
