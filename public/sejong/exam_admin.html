<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모의고사 결과 관리</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="exam_admin.css?v=20260711-26">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="admin-header">
        <a href="app.html" class="back-btn"><span class="material-icons">arrow_back</span></a>
        <h1>모의고사 결과 관리</h1>
        <select id="studentSelect" onchange="openAnalysis(this.value)" class="student-select">
            <option value="">학생 응시 기록 불러오는 중...</option>
        </select>
    </div>

    <div class="container" style="background: #e2e8f0; min-height: 100vh; padding: 20px; display: flex; justify-content: center;">
        
        <div id="noDataMessage" style="text-align: center; padding: 50px; color: #64748b; font-size: 1.2rem;">
            표시할 학생 데이터가 없습니다.
        </div>

        <div class="report-a4" id="reportArea" style="display: none;">
            
            <div class="report-columns">
                <!-- Left Column -->
                <div class="report-left">
                    <div class="report-header">
                        <div class="report-title-box">
                            <h2 id="reportExamName">조리기능사</h2>
                            <h1>모의고사 결과분석</h1>
                        </div>
                        <div class="report-info-box">
                            <div class="info-row"><span class="info-label">Date :</span> <span class="info-val" id="reportDate">-</span></div>
                            <div class="info-row"><span class="info-label">Level :</span> <span class="info-val" id="reportTime">-</span></div>
                            <div class="info-row"><span class="info-label">Name :</span> <span class="info-val" id="reportStudent">-</span></div>
                        </div>
                    </div>

                    <div class="section-title">&lt; 평가 내용 및 문항 결과 &gt;</div>
                    
                    <div class="q-table-wrapper">
                        <!-- Left half (1~30) -->
                        <table class="q-table" id="qTable1">
                            <thead>
                                <tr>
                                    <th>문항</th>
                                    <th>정답</th>
                                    <th>학생답</th>
                                    <th>여부</th>
                                    <th>내용영역</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        
                        <!-- Right half (31~60) -->
                        <table class="q-table" id="qTable2">
                            <thead>
                                <tr>
                                    <th>문항</th>
                                    <th>정답</th>
                                    <th>학생답</th>
                                    <th>여부</th>
                                    <th>내용영역</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <!-- Footer placed inside Left Column as in the image -->
                    <div class="report-footer">
                        <div class="footer-left-content">
                            <div class="academy-name">세종요리제과기술학원</div>
                            <div class="academy-info">
                                044-862-2303 / 010-3882-6272<br>
                                www.sejongcook.co.kr
                            </div>
                            <div class="footer-slogan">Freedom From The Cooking</div>
                        </div>
                        <div class="stamp-box">
                            <div class="stamp-headers">
                                <div class="stamp-title">결재</div>
                                <div class="stamp-title">담당자</div>
                                <div class="stamp-title">원장</div>
                            </div>
                            <div class="stamp-spaces">
                                <div class="stamp-space"></div>
                                <div class="stamp-space"></div>
                                <div class="stamp-space"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="report-right">
                    
                    <div class="section-title">&lt; 영역별 정답률 분석 &gt;</div>
                    <div class="chart-box">
                        <div class="canvas-wrapper">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>

                    <div class="section-title">&lt; 학생 학습 밸런스 분석 &gt;</div>
                    <div class="chart-box">
                        <div class="canvas-wrapper large">
                            <canvas id="radarChart"></canvas>
                        </div>
                    </div>

                    <div class="section-title">&lt; 내용영역 상세 &gt;</div>
                    <div class="analysis-table-wrapper">
                        <table class="analysis-table" id="analysisTable">
                            <thead>
                                <tr>
                                    <th>영역</th>
                                    <th>문항수</th>
                                    <th>정답수</th>
                                    <th>정답률</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
        
        <div class="report-bottom-action">
            <button class="print-send-btn" onclick="window.print()">평가지 출력 및 문자 전송</button>
        </div>
    </div>

    <script src="exam_admin.js?v=20260711-26"></script>
</body>
</html>
